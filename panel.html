
<!DOCTYPE html>
<html lang="es" data-version="2.10">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3A Admin - Tres Arroyos</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
  :root{--azul:#0d4a8a;--verde:#1a7f37;--rojo:#c62828;--naranja:#e65100;--urg:#d50000;--whats:#25D366;--violeta:#8e24aa;}
  *{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{margin:0;background: url('muni3a.jpg') no-repeat center fixed;background-size: cover;padding:16px;min-height:100vh;}
  body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:-1;}
.wrap{max-width:1200px;margin:0 auto}
  h1{color:#fff;margin:0 0 12px;font-size:28px;display:flex;justify-content:space-between;align-items:center;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.login-box{max-width:400px;margin:80px auto;background:rgba(0,0,0,.4);padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.5);backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,.2)}
.login-box h2{color:#fff;text-align:center;margin:0 0 20px;font-size:24px}
.login-box input{width:100%;padding:18px;border:2px solid rgba(255,255,255,.3);border-radius:12px;font-size:18px;margin-bottom:12px;background:rgba(255,255,255,.9)}
.login-box button{width:100%;padding:18px;background:var(--azul);color:#fff;border:0;border-radius:12px;font-size:20px;font-weight:900;cursor:pointer}
.error{color:#ff6b6b;font-size:15px;text-align:center;margin-top:8px;font-weight:800}
.hidden{display:none}
.tabs-admin{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.tab-admin{padding:18px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.3);border-radius:16px;color:#fff;font-weight:900;font-size:16px;cursor:pointer;text-align:center;backdrop-filter: blur(8px);transition:.3s}
.tab-admin.active{background:rgba(13,74,138,.85);border-color:var(--azul)}
.seccion-admin{display:none}
.seccion-admin.active{display:block}
.topbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:rgba(255,255,255,.18);border-radius:16px;padding:14px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.3);cursor:pointer;border:2px solid rgba(255,255,255,.3);backdrop-filter: blur(8px); color:#fff; transition:.3s}
.stat:hover{border-color:#fff; transform:translateY(-3px)}
.stat.active{border-color:var(--azul);background:rgba(13,74,138,.85)}
.stat.num{font-size:28px;font-weight:900}
.stat.reveer.num{color:#ce93d8}
.stat.urg.num{color:#ff6b6b}
.stat.prox.num{color:#ffc107}
.stat.txt{font-size:12px;color:#f0f0f0;font-weight:700;margin-top:4px}
.cal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:#fff}
.cal-header button{background:rgba(255,255,255,.2);border:0;color:#fff;padding:12px 20px;border-radius:12px;font-weight:900;cursor:pointer;font-size:18px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;background:rgba(0,0,0,.2);padding:12px;border-radius:16px}
.cal-dia-nombre{color:#fff;font-weight:900;text-align:center;padding:8px}
.cal-dia{background:rgba(255,255,255,.15);border-radius:12px;padding:8px;min-height:90px;cursor:pointer;border:2px solid transparent;transition:.2s}
.cal-dia:hover{border-color:#fff;background:rgba(255,255,255,.25)}
.cal-dia.otro-mes{opacity:.4}
.cal-dia.hoy{border-color:#ffc107;background:rgba(255,193,7,.3)}
.cal-num{font-weight:900;color:#fff;font-size:16px}
.cal-evento{background:var(--naranja);color:#fff;padding:4px 6px;border-radius:8px;margin-top:4px;font-size:11px;font-weight:900;text-align:center}
.cal-lista{margin-top:20px}
.buscador{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.buscador input{flex:1;min-width:200px;padding:16px;border:2px solid rgba(255,255,255,.3);border-radius:12px;font-size:16px;background:rgba(255,255,255,.9)}
.buscador button{background:var(--azul);color:#fff;border:0;padding:16px 20px;border-radius:12px;font-weight:900;cursor:pointer;font-size:16px}
.resumen{background:rgba(13,74,138,.85);color:#fff;padding:16px;border-radius:12px;margin-bottom:16px;font-weight:800;font-size:16px}
.card{position:relative;background:rgba(255,255,255,.18);border-radius:20px;padding:20px;margin-bottom:16px;box-shadow:0 8px 25px rgba(0,0,0,.3);backdrop-filter: blur(10px); border:1px solid rgba(255,255,255,.3)}
.pedido{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.datos{line-height:1.8;font-size:15px;color:#fff}
.tag{padding:6px 14px;border-radius:14px;font-size:13px;font-weight:900;color:#fff;display:inline-block;margin-right:6px}
.Pendiente{background:#777}.Aprobado{background:var(--verde)}.Rechazado{background:var(--rojo)}.Entrevista{background:var(--naranja)}.Urgente{background:var(--urg)}.Reveer{background:var(--violeta)}
.btns{display:flex;flex-direction:column;gap:10px;min-width:180px}
  button{border:0;padding:14px;border-radius:10px;font-weight:900;cursor:pointer;color:#fff;font-size:15px;transition:.2s}
.btn-aprobar{background:var(--verde)}.btn-rechazar{background:var(--rojo)}.btn-whatsapp{background:var(--whats)}.btn-reveer{background:var(--violeta)}.btn-logout{background:rgba(120,120,120,.7);font-size:14px;padding:10px 16px}
.btn-logout:hover{background:rgba(120,120,120,.9)}
  img{max-width:140px;border-radius:12px;cursor:pointer;margin-top:8px;border:3px solid #fff}
  textarea,input{width:100%;padding:14px;border:2px solid rgba(255,255,255,.3);border-radius:10px;margin-top:6px;font-size:16px;background:rgba(255,255,255,.9)}
  label{font-weight:800;font-size:15px;margin-top:10px;display:block;color:#fff}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal.card{max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.vacio{text-align:center;padding:40px;color:#f0f0f0;font-size:18px;font-weight:700}
.contador{font-size:15px;color:#f0f0f0;margin-bottom:12px;font-weight:700}
.badge-urg{position:absolute;background:var(--urg);color:#fff;font-size:11px;padding:4px 8px;border-radius:10px;top:12px;right:12px;font-weight:900}
.proxima-card{border-left:6px solid #ffc107;background:rgba(255,193,7,.15)}
.proxima-tiempo{font-size:20px;font-weight:900;color:#ffc107;margin-bottom:8px}
.btn-agregar-dia{background:var(--verde);width:100%;margin-top:12px;font-size:16px}
@media(max-width:700px){.tabs-admin{grid-template-columns:1fr}.cal-dia{min-height:70px}.topbar{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loginScreen">
    <div class="login-box">
      <h2>🏛️ Acceso Panel 3A</h2>
      <input type="password" id="claveInput" placeholder="Ingresar clave" onkeyup="if(event.key==='Enter') login()">
      <button onclick="login()">Ingresar</button>
      <div id="loginError" class="error hidden">Clave incorrecta</div>
      <small style="color:#ccc;display:block;text-align:center;margin-top:10px">Municipalidad de Tres Arroyos v2.10</small>
    </div>
  </div>

  <div id="panelScreen" class="hidden">
    <h1>🏛️ Panel 3A - Acción Social <button class="btn-logout" onclick="logout()">🚪 Salir</button></h1>
    <span style="font-size:13px;color:#ccc" id="lastUpdate"></span>

    <div class="tabs-admin">
      <button class="tab-admin active" onclick="cambiarSeccion('gestion')">📋 Gestión</button>
      <button class="tab-admin" onclick="cambiarSeccion('proximas')">⏰ Próximas 36hs</button>
      <button class="tab-admin" onclick="cambiarSeccion('agenda')">📅 Agenda</button>
    </div>

    <div id="gestion" class="seccion-admin active">
      <div class="topbar" id="topbar"></div>
      <div class="buscador">
        <input type="text" id="buscarDni" placeholder="Buscar por DNI: 30123456" onkeyup="if(event.key==='Enter') buscarPorDni()">
        <button onclick="buscarPorDni()">🔍 Buscar</button>
        <button onclick="limpiarBusqueda()" style="background:#666">📋 Ver Todos</button>
      </div>
      <div id="contadorTotal" class="contador"></div>
      <div id="resumenDni" class="hidden"></div>
      <div id="lista"></div>
    </div>

    <div id="proximas" class="seccion-admin">
      <h2 style="color:#fff;text-align:center;font-size:26px;margin-bottom:16px">Entrevistas en las próximas 36 horas</h2>
      <button class="btn-whatsapp" style="width:100%;margin-bottom:16px;font-size:18px;padding:18px" onclick="recordatorioMasivo36()">🔔 Enviar Recordatorio MASIVO a TODOS</button>
      <div id="listaProximas"></div>
    </div>

    <div id="agenda" class="seccion-admin">
      <div class="cal-header">
        <button onclick="cambiarMes(-1)">← Anterior</button>
        <h2 id="calMesAnio" style="color:#fff;margin:0"></h2>
        <button onclick="cambiarMes(1)">Siguiente →</button>
      </div>
      <div class="cal-grid" id="calendario"></div>
      <div class="cal-lista">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h3 id="tituloDia" style="color:#fff;margin:0">Seleccioná un día</h3>
          <button id="btnAgregarDia" class="btn-agregar-dia hidden" onclick="abrirAgregarDesdeAgenda()">+ Agregar Entrevista</button>
        </div>
        <div id="listaDia"></div>
      </div>
    </div>
  </div>
</div>

<div id="modalFoto" class="modal" onclick="cerrarFoto()"><img id="imgGrande" src=""></div>
<div id="modalEntrevista" class="modal" style="display:none">
  <div class="card" onclick="event.stopPropagation()">
    <h3 id="modalTitulo" style="margin-top:0;color:#ffc107">📅 Agendar Entrevista</h3>
    <label>Buscar Pedido por DNI *</label><input type="text" id="entDni" placeholder="30123456" onkeyup="buscarPedidoPorDni()">
    <div id="datosPedidoEncontrado" style="background:rgba(255,255,255,.1);padding:12px;border-radius:10px;margin:10px 0;display:none"></div>
    <input type="hidden" id="entPedidoId">
    <label>Fecha *</label><input type="date" id="entFecha">
    <label>Hora *</label><input type="time" id="entHora">
    <label>Lugar</label><input type="text" id="entLugar" placeholder="Acción Social">
    <label>Observaciones</label><textarea id="entObs" rows="2"></textarea>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-whatsapp" style="flex:1;background:var(--naranja)" onclick="confirmarEntrevista()">Guardar Entrevista</button>
      <button style="background:#666" onclick="cerrarEntrevista()">Cancelar</button>
    </div>
  </div>
</div>

<script>
const CLAVE_ADMIN = '3A2026';
let pedidos = [];
let filtroDni = '';
let filtroEstado = '';
let ultimoHash = '';
let logueado = false;
let fechaCalendario = new Date();
let diaSeleccionado = '';

function login(){const clave=document.getElementById('claveInput').value;if(clave===CLAVE_ADMIN){logueado=true;sessionStorage.setItem('3A_logueado','ok');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('panelScreen').classList.remove('hidden');iniciarPanel();}else{document.getElementById('loginError').classList.remove('hidden');document.getElementById('claveInput').value='';document.getElementById('claveInput').focus();}}
function logout(){logueado=false;sessionStorage.removeItem('3A_logueado');document.getElementById('panelScreen').classList.add('hidden');document.getElementById('loginScreen').classList.remove('hidden');document.getElementById('claveInput').value='';}
function checkLogin(){if(sessionStorage.getItem('3A_logueado')==='ok'){logueado=true;document.getElementById('loginScreen').classList.add('hidden');document.getElementById('panelScreen').classList.remove('hidden');iniciarPanel();}}
function iniciarPanel(){cargarPedidos();setInterval(cargarPedidos,3000);}

function cambiarSeccion(sec){
  document.querySelectorAll('.tab-admin').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.seccion-admin').forEach(s=>s.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(sec).classList.add('active');
  if(sec==='proximas') cargarProximas36();
  if(sec==='agenda') renderizarCalendario();
}

function cargarPedidos(){
  if(!logueado)return;
  try{
    const data=localStorage.getItem('pedidos3A');
    const nuevosPedidos=data?JSON.parse(data):[];
    if(!Array.isArray(nuevosPedidos))return;
    const hash=JSON.stringify(nuevosPedidos);
    if(hash!==ultimoHash){
      const pedidosAntes=pedidos.length;
      pedidos=nuevosPedidos;
      ultimoHash=hash;
      const updateSpan=document.getElementById('lastUpdate');
      updateSpan.innerText=`· Act: ${new Date().toLocaleTimeString('es-AR')}`;
      if(pedidosAntes>0 && pedidos.length>pedidosAntes){
        updateSpan.innerText+=` 🔔 ${pedidos.length-pedidosAntes} PEDIDO/S NUEVO/S!`;
        updateSpan.style.color='#ffc107';updateSpan.style.fontWeight='900';
        setTimeout(()=>{updateSpan.style.color='#ccc';updateSpan.style.fontWeight='400';},4000);
      }
      renderizar();cargarProximas36();
      if(document.getElementById('agenda').classList.contains('active')) renderizarCalendario();
    }
  }catch(e){console.error('Error:',e)}
}

function limpiarDni(dni){return(dni||'').toString().replace(/\D/g,'');}
function buscarPorDni(){filtroDni=limpiarDni(document.getElementById('buscarDni').value.trim());filtroEstado='';limpiarFiltroActivo();renderizar();}
function limpiarBusqueda(){document.getElementById('buscarDni').value='';filtroDni='';filtroEstado='';limpiarFiltroActivo();renderizar();}
function filtrarPorEstado(estado){filtroEstado=estado;filtroDni='';document.getElementById('buscarDni').value='';document.querySelectorAll('.stat').forEach(s=>s.classList.remove('active'));event.currentTarget.classList.add('active');renderizar();}
function limpiarFiltroActivo(){document.querySelectorAll('.stat').forEach(s=>s.classList.remove('active'));document.querySelector('.stat.todo').classList.add('active');}

function horasHastaEntrevista(fechaStr,horaStr){
  const [d,m,y]=fechaStr.split('/').map(Number);
  const [h,min]=horaStr.split(':').map(Number);
  const fechaEnt=new Date(y,m-1,d,h,min);
  const ahora=new Date();
  return (fechaEnt-ahora)/1000/60/60;
}

function cambiarMes(dif){fechaCalendario.setMonth(fechaCalendario.getMonth() + dif);renderizarCalendario();}
function renderizarCalendario(){
  const año=fechaCalendario.getFullYear();const mes=fechaCalendario.getMonth();
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  document.getElementById('calMesAnio').innerText=`${meses[mes]} ${año}`;
  const primerDia=new Date(año,mes,1).getDay();const diasMes=new Date(año,mes+1,0).getDate();const diasMesAnt=new Date(año,mes,0).getDate();
  const nombresDia=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  let html=nombresDia.map(d=>`<div class="cal-dia-nombre">${d}</div>`).join('');
  for(let i=primerDia-1;i>=0;i--){html+=`<div class="cal-dia otro-mes"><div class="cal-num">${diasMesAnt-i}</div></div>`;}
  const hoy=new Date();
  for(let d=1;d<=diasMes;d++){
    const fechaStr=`${d}/${mes+1}/${año}`;
    const esHoy=d===hoy.getDate()&&mes===hoy.getMonth()&&año===hoy.getFullYear();
    const entrevistasDia=pedidos.filter(p=>p.estado==='Entrevista'&&p.entrevista&&p.entrevista.fecha===fechaStr);

    let previewHtml = '';
    if(entrevistasDia.length === 1){
      previewHtml = `<div class="cal-evento">${entrevistasDia[0].entrevista.hora} - ${entrevistasDia[0].nombre.split(' ')[0]}</div>`;
    } else if(entrevistasDia.length > 1){
      previewHtml = `<div class="cal-evento" style="background:var(--urg)">${entrevistasDia.length} ENTREVISTAS</div>`;
    }

    html+=`<div class="cal-dia ${esHoy?'hoy':''}" onclick="mostrarDia('${fechaStr}')"><div class="cal-num">${d}</div>${previewHtml}</div>`;
  }
  document.getElementById('calendario').innerHTML=html;
}

function mostrarDia(fechaStr){
  diaSeleccionado=fechaStr;document.getElementById('btnAgregarDia').classList.remove('hidden');
  const entrevistasDia=pedidos.filter(p=>p.estado==='Entrevista'&&p.entrevista&&p.entrevista.fecha===fechaStr).sort((a,b)=>a.entrevista.hora.localeCompare(b.entrevista.hora));
  document.getElementById('tituloDia').innerText=`Entrevistas del ${fechaStr}`;
  const div=document.getElementById('listaDia');
  if(entrevistasDia.length===0){div.innerHTML='<div class="card vacio">No hay entrevistas este día</div>';return;}

  div.innerHTML=entrevistasDia.map(p=>{
    const telLimpio=limpiarDni(p.tel);
    const waLink=telLimpio?`https://wa.me/54${telLimpio}`:'#';
    return`
    <div class="card proxima-card">
      <div class="proxima-tiempo">⏰ ${p.entrevista.hora} hs</div>
      <div class="pedido">
        <div class="datos">
          <b>Pedido #${p.id}</b> <span class="tag Entrevista">Entrevista</span> ${p.urgente?'<span class="tag Urgente">🚨</span>':''}<br>
          <b>${p.nombre}</b> - DNI: ${p.dni}<br>
          <b>Tipo:</b> ${p.tipo} ${p.ayudaTipo||''}<br>
          <b>Dirección:</b> ${p.direccion||'-'}<br>
          <b>Tel:</b> ${p.tel||'-'} ${telLimpio?`<a href="${waLink}" target="_blank" style="color:#25D366;font-weight:900">Abrir WhatsApp</a>`:''}<br>
          <b>Lugar:</b> ${p.entrevista.lugar||'Acción Social'}<br>
          <b>Obs:</b> ${p.entrevista.obs||'-'}<br>
          <b>Detalle:</b> ${p.detalle||'-'}<br>
          ${p.foto?`<br><img src="${p.foto}" onclick="verFoto('${p.foto}')">`:''}
        </div>
        <div class="btns">
          <button class="btn-whatsapp" onclick="recordatorioIndividual(${p.id})">💬 Recordatorio</button>
        </div>
      </div>
    </div>`;}).join('');
}

function abrirAgregarDesdeAgenda(){
  document.getElementById('modalTitulo').innerText=`📅 Agregar Entrevista para el ${diaSeleccionado}`;
  document.getElementById('entDni').value='';document.getElementById('datosPedidoEncontrado').style.display='none';document.getElementById('entPedidoId').value='';
  const [d,m,y]=diaSeleccionado.split('/');document.getElementById('entFecha').value=`${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
  document.getElementById('entHora').value='';document.getElementById('entLugar').value='';document.getElementById('entObs').value='';
  document.getElementById('modalEntrevista').style.display='flex';
}

function buscarPedidoPorDni(){
  const dniBuscado=limpiarDni(document.getElementById('entDni').value);
  const p=pedidos.find(x=>limpiarDni(x.dni)===dniBuscado);
  const div=document.getElementById('datosPedidoEncontrado');
  if(p){document.getElementById('entPedidoId').value=p.id;div.style.display='block';div.innerHTML=`<b>✅ Encontrado:</b> ${p.nombre} - Pedido #${p.id} - ${p.tipo}`;}
  else{document.getElementById('entPedidoId').value='';div.style.display='none';}
}

function cargarProximas36(){
  const proximas=pedidos.filter(p=>{if(p.estado!=='Entrevista'||!p.entrevista||!p.tel)return false;const h=horasHastaEntrevista(p.entrevista.fecha,p.entrevista.hora);return h<=36&&h>=0;}).sort((a,b)=>{const fa=a.entrevista.fecha.split('/').reverse().join('-')+' '+a.entrevista.hora;const fb=b.entrevista.fecha.split('/').reverse().join('-')+' '+b.entrevista.hora;return new Date(fa)-new Date(fb);});
  const div=document.getElementById('listaProximas');
  if(proximas.length===0){div.innerHTML='<div class="card vacio">📭 No hay entrevistas en las próximas 36 horas</div>';return;}
  div.innerHTML=proximas.map(p=>{const h=horasHastaEntrevista(p.entrevista.fecha,p.entrevista.hora);const tiempo=h<24?`Faltan ${Math.floor(h)} hs ${Math.floor((h%1)*60)} min`:`Falta ${h.toFixed(1)} hs`;return`<div class="card proxima-card"><div class="proxima-tiempo">⏰ ${tiempo}</div><div class="datos"><b>📅 ${p.entrevista.fecha} ${p.entrevista.hora} hs</b><br><b>${p.nombre}</b> - DNI: ${p.dni}<br><b>Pedido #${p.id}</b> - ${p.tipo} ${p.ayudaTipo||''}<br><b>Lugar:</b> ${p.entrevista.lugar||'Acción Social'}<br><b>Tel:</b> ${p.tel}</div><div class="btns" style="margin-top:12px"><button class="btn-whatsapp" onclick="recordatorioIndividual(${p.id})">💬 Enviar Recordatorio INDIVIDUAL</button></div></div>`;}).join('');
}

function recordatorioMasivo36(){
  const proximas=pedidos.filter(p=>{if(p.estado!=='Entrevista'||!p.entrevista||!p.tel)return false;const h=horasHastaEntrevista(p.entrevista.fecha,p.entrevista.hora);return h<=36&&h>=0;});
  if(proximas.length===0){alert('No hay entrevistas en las próximas 36hs');return;}
  if(!confirm(`Se enviarán ${proximas.length} recordatorios por WhatsApp. ¿Seguir?`))return;
  proximas.forEach((p,i)=>{setTimeout(()=>{const msj=`Hola ${p.nombre}! Desde Acción Social 3A te recordamos que tu entrevista es el ${p.entrevista.fecha} a las ${p.entrevista.hora} hs en ${p.entrevista.lugar||'Acción Social'}. 📅\nPedido #${p.id}`;enviarWA(p,msj);},i*900);});
  alert(`Se abrirán ${proximas.length} chats de WhatsApp. Esperá que carguen.`);
}

function recordatorioIndividual(id){
  const p=pedidos.find(x=>x.id===id);if(!p||!p.tel){alert('Sin teléfono');return;}
  const msj=`Hola ${p.nombre}! Desde Acción Social 3A te recordamos que tu entrevista es el ${p.entrevista.fecha} a las ${p.entrevista.hora} hs en ${p.entrevista.lugar||'Acción Social'}. 📅\nPedido #${p.id}`;
  enviarWA(p,msj);
}

function renderizar(){
  const reveer=pedidos.filter(p=>p.estado==='Pendiente'&&p.fueRechazado).length;
  const totales={Total:pedidos.length,Pendiente:0,Aprobado:0,Rechazado:0,Entrevista:0,Urgente:0,Reveer:reveer};
  pedidos.forEach(p=>{const e=p.estado.toString().trim();if(totales.hasOwnProperty(e))totales[e]++;if(p.urgente)totales.Urgente++;});
  const prox36=pedidos.filter(p=>p.estado==='Entrevista'&&p.entrevista&&horasHastaEntrevista(p.entrevista.fecha,p.entrevista.hora)<=36&&horasHastaEntrevista(p.entrevista.fecha,p.entrevista.hora)>=0).length;

  document.getElementById('topbar').innerHTML=`
    <div class="stat todo active" onclick="limpiarBusqueda()"><div class="num">${totales.Total}</div><div class="txt">TOTAL</div></div>
    <div class="stat" onclick="filtrarPorEstado('Pendiente')"><div class="num">${totales.Pendiente}</div><div class="txt">PENDIENTES</div></div>
    <div class="stat" onclick="filtrarPorEstado('Aprobado')"><div class="num">${totales.Aprobado}</div><div class="txt">APROBADOS</div></div>
    <div class="stat" onclick="filtrarPorEstado('Rechazado')"><div class="num">${totales.Rechazado}</div><div class="txt">RECHAZADOS</div></div>
    <div class="stat" onclick="filtrarPorEstado('Entrevista')"><div class="num">${totales.Entrevista}</div><div class="txt">ENTREVISTA</div></div>
    <div class="stat reveer" onclick="filtrarPorEstado('Reveer')"><div class="num">${totales.Reveer}</div><div class="txt">🔄 REVEER</div></div>
    <div class="stat prox" onclick="cambiarSeccion('proximas')"><div class="num">${prox36}</div><div class="txt">⏰ PRÓX. 36HS</div></div>
    <div class="stat urg" onclick="filtrarPorEstado('Urgente')"><div class="num">${totales.Urgente}</div><div class="txt">🚨 URGENTES</div></div>`;

  document.getElementById('contadorTotal').innerText=`Mostrando ${pedidos.length} pedidos en sistema`;
  let pedidosFiltrados=pedidos;
  if(filtroDni){
    pedidosFiltrados=pedidos.filter(p=>limpiarDni(p.dni)===filtroDni);
    const estados={Pendiente:0,Aprobado:0,Rechazado:0,Entrevista:0};
    pedidosFiltrados.forEach(p=>{const e=p.estado.toString().trim();if(estados.hasOwnProperty(e))estados[e]++;});
    const nombre=pedidosFiltrados.length>0?pedidosFiltrados[0].nombre:'No encontrado';
    document.getElementById('resumenDni').innerHTML=`<div class="resumen">DNI: ${filtroDni} | ${nombre} | Total: ${pedidosFiltrados.length} | ${estados.Pendiente} Pend | ${estados.Aprobado} Aprob | ${estados.Rechazado} Rech | ${estados.Entrevista} Ent</div>`;
    document.getElementById('resumenDni').classList.remove('hidden');
  }
  else if(filtroEstado){
    if(filtroEstado==='Reveer'){pedidosFiltrados=pedidos.filter(p=>p.estado==='Pendiente'&&p.fueRechazado);}
    else if(filtroEstado==='Urgente'){pedidosFiltrados=pedidos.filter(p=>p.urgente===true);}
    else{pedidosFiltrados=pedidos.filter(p=>p.estado.toString().trim()===filtroEstado);}
    document.getElementById('resumenDni').classList.add('hidden');
  }
  else{document.getElementById('resumenDni').classList.add('hidden');}

  const div=document.getElementById('lista');
  if(pedidosFiltrados.length===0){div.innerHTML='<div class="card vacio">📭 No hay pedidos para mostrar</div>';return;}

  div.innerHTML=pedidosFiltrados.sort((a,b)=>b.id-a.id).map(p=>{
    const telLimpio=limpiarDni(p.tel);
    const waLink=telLimpio?`https://wa.me/54${telLimpio}`:'#';
    const estado=p.estado.toString().trim();
    const esReveer=estado==='Pendiente'&&p.fueRechazado;
    return`
    <div class="card">${p.urgente?'<div class="badge-urg">URGENTE</div>':''}
      <div class="pedido">
        <div class="datos">
          <b>Pedido #${p.id}</b> <span class="tag ${esReveer?'Reveer':estado}">${esReveer?'Reveer':estado}</span> ${p.urgente?'<span class="tag Urgente">🚨</span>':''}<br>
          <b>${p.nombre}</b> - DNI: ${p.dni}<br>
          <b>Tipo:</b> ${p.tipo} ${p.ayudaTipo||''}<br>
          <b>Dirección:</b> ${p.direccion||'-'}<br>
          <b>Tel:</b> ${p.tel||'-'} ${telLimpio?`<a href="${waLink}" target="_blank" style="color:#25D366;font-weight:900">Abrir WhatsApp</a>`:''}<br>
          <b>Detalle:</b> ${p.detalle||'-'}<br>
          <b>Fecha:</b> ${p.fechaPedido} ${p.fechaRespuesta?`| <b>Respuesta:</b> ${p.fechaRespuesta}`:''}
          ${p.motivo?`<br><b>Motivo Rechazo:</b> ${p.motivo}`:''}
          ${p.entrevista?`<br><b>Entrevista:</b> ${p.entrevista.fecha} ${p.entrevista.hora} hs - ${p.entrevista.lugar}`:''}
          ${p.foto?`<br><img src="${p.foto}" onclick="verFoto('${p.foto}')">`:''}
        </div>
        <div class="btns">
          <button class="btn-aprobar" onclick="aprobar(${p.id})">✅ Aprobar</button>
          <button class="btn-rechazar" onclick="rechazar(${p.id})">❌ Rechazar</button>
          ${esReveer?`<button class="btn-reveer" onclick="reveer(${p.id})">🔄 Reveer</button>`:''}
        </div>
      </div>
    </div>`;}).join('');
}

function aprobar(id){const p=pedidos.find(x=>x.id===id);if(!p)return;p.estado='Aprobado';p.fueRechazado=false;p.motivo='';p.fechaRespuesta=new Date().toLocaleString('es-AR');guardar();enviarWA(p,`Hola ${p.nombre}! Su pedido #${p.id} de ${p.tipo} fue APROBADO ✅\nPase por Acción Social lun a vie 7 a 13hs.`);}
function rechazar(id){const motivo=prompt('Motivo del rechazo:');if(!motivo)return;const p=pedidos.find(x=>x.id===id);if(!p)return;p.estado='Rechazado';p.fueRechazado=true;p.motivo=motivo.trim();p.fechaRespuesta=new Date().toLocaleString('es-AR');guardar();enviarWA(p,`Hola ${p.nombre}. Su pedido #${p.id} fue RECHAZADO ❌\nMotivo: ${motivo}`);}
function reveer(id){if(!confirm('¿Volver este pedido a Pendiente para revisarlo de nuevo?'))return;const p=pedidos.find(x=>x.id===id);if(!p)return;p.estado='Pendiente';p.fueRechazado=true;p.motivo='';p.fechaRespuesta='';guardar();alert('Pedido marcado para Reveer');}

function cerrarEntrevista(){document.getElementById('modalEntrevista').style.display='none';}
function confirmarEntrevista(){
  const id=document.getElementById('entPedidoId').value;
  const fecha=document.getElementById('entFecha').value;
  const hora=document.getElementById('entHora').value;
  const lugar=document.getElementById('entLugar').value||'Acción Social';
  const obs=document.getElementById('entObs').value;
  if(!id||!fecha||!hora){alert('Buscá el DNI del pedido y completá fecha y hora');return;}
  const p=pedidos.find(x=>x.id==id);if(!p){alert('Pedido no encontrado');return;}
  
  p.estado='Entrevista';
  p.entrevista={fecha:fecha.split('-').reverse().join('/'),hora,lugar,obs};
  p.fechaRespuesta=new Date().toLocaleString('es-AR');
  guardar();
  
  let msj=`Hola ${p.nombre}! Tiene ENTREVISTA por su pedido #${p.id} de ${p.tipo} 📅\nFecha: ${p.entrevista.fecha} ${hora} hs\nLugar: ${lugar}\n`;
  if(obs)msj+=`Obs: ${obs}`;
  enviarWA(p,msj);
  cerrarEntrevista();
  alert('Entrevista agendada y WhatsApp enviado');
  if(document.getElementById('agenda').classList.contains('active')) mostrarDia(diaSeleccionado);
}

function enviarWA(pedido,mensaje){
  const tel=limpiarDni(pedido.tel);
  if(!tel){alert('El vecino no cargó teléfono');return;}
  window.open(`https://wa.me/54${tel}?text=${encodeURIComponent(mensaje)}`,'_blank');
}

function guardar(){localStorage.setItem('pedidos3A',JSON.stringify(pedidos));}

function verFoto(src){document.getElementById('imgGrande').src=src;document.getElementById('modalFoto').style.display='flex';}

function cerrarFoto(){document.getElementById('modalFoto').style.display='none';}

checkLogin();
</script>
